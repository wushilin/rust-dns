name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install dnspython
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -- --test-threads=1
      - run: node tests/ui/duration.test.js
      - run: cargo build
      - run: scripts/conformance-local.sh target/debug/rust-dns
      - name: UDP load probe (Linux)
        run: scripts/load-test-local.sh target/debug/rust-dns 5 8
