name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install dnspython cryptography
      # Independent DNSSEC validators for tests/dnssec.rs and tests/follow.rs:
      # dnssec-verify, dnssec-dsfromkey (bind9-utils), delv and dig (bind9-dnsutils).
      - run: sudo apt-get update && sudo apt-get install -y bind9-utils bind9-dnsutils
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast -- --test-threads=1
        env:
          REQUIRE_BIND_TOOLS: "1"
          # tests/netlink.rs: a network namespace through `sudo -n unshare -n`.
          REQUIRE_NETLINK_TEST: "1"
      # O0c: every test server exits with its test process; none may remain.
      - name: No test server outlived its test
        run: if pgrep -fa 'target/debug/rust-dns --config'; then echo "orphaned test servers"; exit 1; fi
      - run: node tests/ui/duration.test.js
      - run: node tests/ui/access.test.js
      - run: cargo build
      # tests/ui/browser.test.js (M4): headless Chrome over CDP, no npm packages.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: node tests/ui/browser.test.js
        env:
          REQUIRE_BROWSER_TEST: "1"
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - run: scripts/conformance-local.sh target/debug/rust-dns
      - name: UDP load probe (Linux)
        run: scripts/load-test-local.sh target/debug/rust-dns 5 8

  # O14: the console's live updates through a reverse proxy. tests/proxy.rs
  # starts an unprivileged nginx (own prefix and ports) in front of the
  # server; it is skipped where nginx is missing, required here.
  nginx-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y nginx
      # The package starts a system nginx on port 80; the test runs its own.
      - run: sudo systemctl stop nginx || true
      - run: cargo test --test proxy -- --nocapture
        env:
          REQUIRE_NGINX_TEST: "1"
          NGINX_BIN: /usr/sbin/nginx

  # O20: the Windows build, and the binary as a Windows service: installed
  # (--install-service), started and stopped through the service control
  # manager, answering DNS and the API in between, then removed.
  windows-service:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: python scripts/smoke-release.py target/debug/rust-dns.exe
      - run: python scripts/smoke-release.py --windows-service target/debug/rust-dns.exe
