name: Release

# Builds rust-dns for Linux, Windows and FreeBSD on x86_64 and aarch64.
# Every build is smoke-tested on its own platform (scripts/smoke-release.py:
# start, API, DNS over UDP and TCP) wherever the runner can execute it.
#
#   push a tag vX.Y.Z      -> build, test, publish a GitHub release
#                             (tags with a '-' such as v1.2.0-rc.1 are pre-releases),
#                             push the multi-arch image to ghcr.io/<owner>/rust-dns
#   run manually           -> build and test only; archives are kept as workflow artifacts
#
# Also built and tested from the Linux binaries: Debian packages (.deb,
# installed and exercised under systemd), a multi-arch container image
# (linux/amd64 + linux/arm64), and a Homebrew formula (source build).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version from tag (must match Cargo.toml)
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            case "$tag" in
              "$crate"|"$crate"-*) ;;
              *) echo "::error::tag v$tag does not match Cargo.toml version $crate"; exit 1 ;;
            esac
            echo "version=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=$crate-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            debarch: amd64
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            debarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build (static musl)
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Register qemu for aarch64
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Smoke test
        run: |
          file target/${{ matrix.target }}/release/rust-dns
          python3 scripts/smoke-release.py target/${{ matrix.target }}/release/rust-dns
      - name: Package
        run: |
          name=rust-dns-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/rust-dns README.md "dist/$name/"
          cp -r examples "dist/$name/"
          cp deploy/install.sh "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - name: Debian package (O19)
        run: |
          python3 scripts/build-deb.py target/${{ matrix.target }}/release/rust-dns \
            "${{ needs.version.outputs.version }}" ${{ matrix.debarch }} dist
          python3 scripts/check-deb.py dist/*.deb ${{ matrix.debarch }}
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error
      # The bare binary for the container image (O18).
      - name: Binary for the image
        run: |
          mkdir -p image
          cp target/${{ matrix.target }}/release/rust-dns image/rust-dns-linux-${{ matrix.debarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: image-bin-${{ matrix.debarch }}
          path: image/
          if-no-files-found: error

  # O19: the amd64 package installed with apt on a systemd runner, its
  # service started by the package and exercised (API, DNS over UDP and
  # TCP), then removed. A config written before the install (high ports;
  # port 53 is taken by systemd-resolved on the runner) is kept.
  deb-install:
    needs: [version, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist
      - name: Install, exercise, remove
        run: |
          set -e
          sudo install -d -m 0700 /etc/rust-dns
          python3 scripts/smoke-release.py --print-smoke-config 5300 8853 /var/lib/rust-dns/smoke.db \
            | sudo tee /etc/rust-dns/rust-dns.toml >/dev/null
          sudo apt-get update
          sudo apt-get install -y ./dist/rust-dns_*_amd64.deb
          sudo stat -c '%a %U %n' /etc/rust-dns /etc/rust-dns/rust-dns.toml /var/lib/rust-dns
          systemctl is-enabled rust-dns
          for i in $(seq 30); do systemctl is-active --quiet rust-dns && break; sleep 1; done
          systemctl status rust-dns --no-pager
          python3 scripts/smoke-release.py --attach 8853 5300
          sudo apt-get remove -y rust-dns
          if systemctl is-active --quiet rust-dns; then echo "still running after remove"; exit 1; fi
          test ! -e /usr/bin/rust-dns
          sudo test -f /etc/rust-dns/rust-dns.toml
      - name: Service log
        if: always()
        run: sudo journalctl -u rust-dns --no-pager | tail -50

  # O18: the multi-arch image from the release binaries. Pushed to GHCR
  # only for a tag (private repository: the package is private); a manual
  # run builds both platforms and tests the amd64 image.
  docker:
    needs: [version, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-bin-*
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rust-dns" >> "$GITHUB_OUTPUT"
      - name: Test the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.release
          platforms: linux/amd64
          load: true
          tags: rust-dns:test
      - name: Smoke test the image
        run: |
          set -e
          docker run --rm rust-dns:test --version
          docker volume create rdns
          python3 scripts/smoke-release.py --print-smoke-config 5300 8853 /data/smoke.db 0.0.0.0 \
            | docker run -i --rm -v rdns:/data --entrypoint sh rust-dns:test -c 'cat > /data/rust-dns.toml'
          docker run -d --name rdns -v rdns:/data -p 127.0.0.1:5300:5300/udp -p 127.0.0.1:5300:5300/tcp \
            -p 127.0.0.1:8853:8853 rust-dns:test
          python3 scripts/smoke-release.py --attach 8853 5300
          docker exec rdns id
          docker logs rdns | tail -5
          docker rm -f rdns
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build both platforms (push for a tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ (github.ref_type == 'tag' && !contains(github.ref_name, '-')) && format('{0}:latest', steps.img.outputs.name) || format('{0}:dev', steps.img.outputs.name) }}

  windows:
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
          - arch: aarch64
            target: aarch64-pc-windows-msvc
    env:
      # Static C runtime: no Visual C++ redistributable needed on the target.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Smoke test
        # An x64 runner cannot execute arm64 binaries; that build is compiled only.
        if: matrix.arch == 'x86_64'
        run: python scripts/smoke-release.py target/${{ matrix.target }}/release/rust-dns.exe
      - name: Smoke test as a Windows service (O20)
        if: matrix.arch == 'x86_64'
        run: python scripts/smoke-release.py --windows-service target/${{ matrix.target }}/release/rust-dns.exe
      - name: Package
        shell: pwsh
        run: |
          $name = "rust-dns-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/${{ matrix.target }}/release/rust-dns.exe, README.md "dist/$name/"
          Copy-Item -Recurse examples "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  freebsd:
    needs: version
    runs-on: ubuntu-latest
    # aarch64 runs under full-system emulation and takes a while.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            vm_arch: ""
          - arch: aarch64
            vm_arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          arch: ${{ matrix.vm_arch }}
          usesh: true
          envs: "VERSION ARCH CARGO_PROFILE_RELEASE_LTO CARGO_PROFILE_RELEASE_CODEGEN_UNITS"
          prepare: |
            sed -i '' 's/quarterly/latest/' /etc/pkg/FreeBSD.conf
            pkg install -y rust python3
          run: |
            set -e
            rustc --version
            cargo build --release
            file target/release/rust-dns
            python3 scripts/smoke-release.py target/release/rust-dns
            name="rust-dns-$VERSION-freebsd-$ARCH"
            mkdir -p "dist/$name"
            cp target/release/rust-dns README.md "dist/$name/"
            cp -r examples "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          # Thin LTO under emulation keeps the aarch64 build to a reasonable time.
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.arch == 'aarch64' && 'thin' || 'true' }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ matrix.arch == 'aarch64' && '8' || '1' }}
      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [version, linux, windows, freebsd, deb-install, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{linux,windows,freebsd}-*"
          merge-multiple: true
      # Only for a public repository: a private one's source archive is not
      # downloadable (404 even with the job token), and Homebrew users could
      # not fetch it either.
      - name: Homebrew formula (O19)
        if: github.ref_type == 'tag' && !github.event.repository.private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          curl -fsSL -H "Authorization: token ${GH_TOKEN}" -o src.tar.gz "$url"
          sha=$(sha256sum src.tar.gz | cut -d' ' -f1)
          python3 scripts/homebrew-formula.py "${{ needs.version.outputs.version }}" "${GITHUB_REF_NAME}" "$sha" "${GITHUB_REPOSITORY}" > dist/rust-dns.rb
          ruby -c dist/rust-dns.rb
          rm src.tar.gz
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "${GITHUB_REF_NAME}" in *-*) pre="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --title "rust-dns ${GITHUB_REF_NAME}" \
            --generate-notes $pre
      - name: Keep archives (manual run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: rust-dns-${{ needs.version.outputs.version }}
          path: dist/*
