[package]
name = "rust-dns"
version = "0.3.0"
edition = "2021"
description = "Lightweight SQLite-backed authoritative DNS server with a realtime web UI and secure API"
license = "Apache-2.0"
default-run = "rust-dns"

[workspace]
members = ["crates/sqlite-cdc"]

[dependencies]
# Changelog v2: trigger-captured, hash-chained change log (shadow mode).
sqlite-cdc = { path = "crates/sqlite-cdc" }
tokio = { version = "1", features = ["full"] }
hickory-proto = "0.26.1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
axum = { version = "0.8", features = ["ws", "macros"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "service", "http1", "http2"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
arc-swap = "1"
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
named_queue = "0.2"
toml = "0.9"
toml_edit = "0.23"
argon2 = { version = "0.5", features = ["std"] }
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
qrcode = { version = "0.14", default-features = false }
flate2 = "1"
lru = "0.18.2"
idna = "1"
libc = "0.2"
# OpenAPI generated from the handlers and types (served at /api/openapi.json).
utoipa = { version = "5.5", features = ["preserve_order", "preserve_path_order"] }
utoipa-axum = "0.2"
# Standby (follow) mode: HTTPS client to the primary. rustls with the ring
# provider (no aws-lc-sys / OpenSSL), OS trust store via the platform verifier.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# DNSSEC signing (ECDSA P-256, key generation): the same ring rustls uses.
ring = "0.17"
# O29: DNS over TLS / HTTPS (server and upstream client), on the same
# rustls + ring; the system trust store through the platform verifier.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7"
http-body-util = "0.1"
bytes = "1"

# O13a: the static musl release builds use mimalloc (musl's allocator kept
# RSS growing under sustained load; see plan.md O13a). `no_thp`: no
# transparent huge pages requested (about 10 MiB less resident memory).
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["no_thp"] }

[dev-dependencies]
ureq = { version = "2", features = ["json", "cookies"] }
jsonschema = { version = "0.58", default-features = false }

# O20: run as a Windows service (pure Rust, over windows-sys).
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[[test]]
name = "compat_dnssec_wushilin_net"
path = "compat/dnssec/wushilin_net.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
