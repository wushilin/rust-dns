# Home / office LAN: authoritative for your internal zones, forwarding
# everything else to public resolvers for LAN clients only.
#
# Point your router's DHCP "DNS server" option at this host.

[server]
bind = ["0.0.0.0", "::"]
port = 53
auto_ptr = true                          # reverse lookups work without maintaining PTR records
default_primary_ns = "ns.home.arpa"
default_hostmaster = "admin@home.arpa"

[forwarding]
upstreams = ["1.1.1.1:53", "9.9.9.9:53", "[2606:4700:4700::1111]:53"]
timeout_ms = 1500
# Only LAN clients may use forwarding. Never add 0.0.0.0/0 here: it is refused
# unless open_resolver = true (see "Running an open resolver" in the README).
allowed_clients = ["127.0.0.0/8", "::1/128", "192.168.0.0/16", "10.0.0.0/8", "fd00::/8", "fe80::/10"]
cache_entries = 20000
cache_max_ttl = 86400          # never cache longer than this (TTLs are never raised)
cache_negative_max_ttl = 3600  # NXDOMAIN / no-data
open_resolver = false          # true only for a deliberate public resolver; then also set
                               # allowed_clients = ["0.0.0.0/0", "::/0"]. Safeguards while on:
# open_resolver_max_udp_payload = 512   # bigger forwarded UDP answers are sent TC=1 (retry over TCP)
# open_resolver_rate_per_second = 20    # forwarded queries/s per client (IPv4 / IPv6 /64); 0 = off

[rate_limit]
max_resolutions_per_second_per_address = 500
max_tracked_addresses = 5000

[database]
path = "/var/lib/rust-dns/rust-dns.db"

[backup]
dir = "/var/lib/rust-dns/backups"
interval_hours = 24
keep = 14

[web_console]
bind = "192.168.1.2:8053"                # LAN address of this host
session_ttl_hours = 24

[root]
username = "root"
password = "change-me-please"   # placeholder: rust-dns refuses to start until you set your own
mfa_required = false

[changelog]
retention_days = 90

[logging]
format = "text"
level = "info"
log_queries = true                       # every query to its own rotated file
file = "/var/log/rust-dns/rust-dns.log"
query_log_file = "/var/log/rust-dns/queries.log"
max_size_mb = 20
max_files = 10
compress = true
