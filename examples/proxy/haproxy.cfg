# HAProxy in front of rust-dns, sending PROXY protocol v2 so rust-dns sees
# the real client address. Pairs with examples/config/behind-proxy.toml,
# where HAProxy's address (10.0.0.10) is the only proxy_trust entry.

global
    log stdout format raw local0

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# DNS over TCP. (UDP DNS should go to rust-dns directly.)
frontend dns_tcp
    bind :53
    default_backend rust_dns_tcp

backend rust_dns_tcp
    server dns1 10.0.0.20:53 send-proxy-v2 check

# Web console. TLS terminates here; rust-dns receives plain HTTP plus PROXY v2.
frontend console
    bind :443 ssl crt /etc/haproxy/certs/dns-admin.example.com.pem
    default_backend rust_dns_console

backend rust_dns_console
    timeout tunnel 1h            # keep the console websocket open
    server dns1 10.0.0.20:8053 send-proxy-v2 check
