# TLS reverse proxy for the rust-dns web console and API.
# Pairs with examples/config/public-primary.toml (console on 127.0.0.1:8053,
# proxy_trust = 127.0.0.1, secure_cookies = true).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dns-admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/dns-admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dns-admin.example.com/privkey.pem;

    client_max_body_size 16m;            # zone imports

    location / {
        proxy_pass http://127.0.0.1:8053;
        proxy_http_version 1.1;
        # Websocket for the live console (/api/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        # Real client address; rust-dns trusts these only from proxy_trust
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # rust-dns then issues a Secure __Host- cookie
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name dns-admin.example.com;
    return 301 https://$host$request_uri;
}
