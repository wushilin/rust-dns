<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rust-dns API</title>
<link rel="stylesheet" href="/rust-dns/docs/swagger-ui.css">
<style>
  body { margin: 0; background: #fff; }
  .swagger-ui .topbar { display: none; }
  #note { font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; background: #fff8e6; color: #5c4400;
          border-bottom: 1px solid #f0dca6; padding: 8px 20px; }
  #note b { font-weight: 600; }
</style>
</head>
<body>
<div id="note"><b>Live API.</b> "Try it out" sends real requests to this server with your permissions: changes are committed and appear in the change log.
  Requests use your signed-in session; to test as an API token, use <b>Authorize</b> and paste the token.</div>
<div id="swagger"></div>
<script src="/rust-dns/docs/swagger-ui-bundle.js"></script>
<script>
  window.ui = SwaggerUIBundle({
    url: '/rust-dns/api/openapi.json',
    dom_id: '#swagger',
    deepLinking: true,
    docExpansion: 'list',
    filter: true,
    displayRequestDuration: true,
    defaultModelsExpandDepth: 0,
    persistAuthorization: false,
    validatorUrl: null, // no third-party validator badge (and no CSP violation)
    // Session-cookie writes must carry the CSRF header; harmless for bearer tokens.
    requestInterceptor: (req) => { req.headers['X-Requested-With'] = 'rust-dns'; const m = document.cookie.match(/(?:^|;\s*)(?:__Host-)?rdns_csrf=([^;]+)/); if (m) req.headers['X-CSRF-Token'] = m[1]; return req; },
  });
</script>
</body>
</html>
